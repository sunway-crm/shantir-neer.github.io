<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunway CRM Lite</title>
<style>
:root{--bg:#f6f7f9;--sf:#fff;--tx:#17202a;--mu:#6a7480;--bd:#e3e6ea;--pr:#0b5aa8;--pb:#e3effb;--on:#fff;--rd:#a32d2d;--rb:#fcebeb;--gn:#0f7f6c;--gb:#dcf5ee;--am:#7a4a08;--ab:#fbeed6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--sf:#1b2128;--tx:#e8ecf0;--mu:#9aa5b1;--bd:#2d353e;--pr:#7fb6f0;--pb:#12304f;--on:#08192b;--rd:#f09595;--rb:#501313;--gn:#5dcaa5;--gb:#0f3a31;--am:#fac775;--ab:#412402}}
:root[data-theme="dark"]{--bg:#12161b;--sf:#1b2128;--tx:#e8ecf0;--mu:#9aa5b1;--bd:#2d353e;--pr:#7fb6f0;--pb:#12304f;--on:#08192b;--rd:#f09595;--rb:#501313;--gn:#5dcaa5;--gb:#0f3a31;--am:#fac775;--ab:#412402}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;max-width:100%;box-sizing:border-box}
button{cursor:pointer}button:hover{border-color:var(--pr)}button.p{background:var(--pr);color:var(--on);border-color:var(--pr);font-weight:600}button.s{padding:4px 10px;font-size:13px}
a{color:var(--pr);text-decoration:none}:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sf);border-bottom:1px solid var(--bd);padding:8px 14px}
.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}header b{font-size:16px}
#nv{display:flex;gap:2px;overflow-x:auto;margin-top:6px}#nv button{border:0;background:none;color:var(--mu);font-weight:500;white-space:nowrap}#nv button.on{background:var(--pb);color:var(--pr)}
main{max-width:900px;margin:0 auto;padding:16px 14px 60px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);margin:22px 0 8px;font-weight:600}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0}
.it{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.it .g{flex:1;min-width:160px;cursor:pointer}
.sp{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:13px}.tag{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;background:var(--pb);color:var(--pr)}.tag.r{background:var(--rb);color:var(--rd)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px}.kp .card{margin:0;text-align:center}.kp b{display:block;font-size:24px;line-height:1.2}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chips button.on,.stg button.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
.bar{height:8px;background:var(--pb);border-radius:4px}.bar i{display:block;height:100%;background:var(--pr);border-radius:4px}
.br{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.g2 .card{margin:0}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
#dw{position:fixed;inset:0 0 0 auto;width:min(480px,100%);background:var(--sf);border-left:1px solid var(--bd);padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));overflow:auto;transform:translateX(105%);transition:transform .15s;z-index:9}#dw.on{transform:none}
.f{display:block;margin:8px 0}.f span{display:block;font-size:12px;color:var(--mu)}.f input:not([type=checkbox]),.f select,.f textarea{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stg{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.log div{padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px;border-bottom:1px solid var(--bd)}
pre{white-space:pre-wrap;font:13px/1.55 system-ui,sans-serif;margin:0}
.tl{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;border:1px solid var(--bd);border-radius:10px;font-size:13px}.tl div{display:flex;gap:4px;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:20}
@media(prefers-reduced-motion:reduce){#dw{transition:none}}
</style></head><body>
<header><div class="hr"><b>Sunway CRM</b><select id="me" aria-label="Current user" onchange="D.set.me=this.value;save();render()"></select><span style="flex:1"></span><input id="q" type="search" placeholder="Search…" aria-label="Search" style="width:140px"><button class="p" onclick="addLead()">+ Lead</button></div><nav id="nv"></nav></header>
<main id="m"></main><aside id="dw"></aside><div id="toast"></div>
<datalist id="dl-country"></datalist><datalist id="dl-specialty"></datalist><datalist id="dl-hospital"></datalist><datalist id="dl-source"></datalist><datalist id="dl-partner"></datalist>
<script>
const ST=[["New",0,"Contact the patient"],["Contacted",2,"Follow up if no reply"],["Docs requested",1,"Chase documents"],["Docs received",0,"Send to hospital"],["With hospital",3,"Chase hospital feedback"],["Plan received",0,"Share plan with patient"],["Quote sent",2,"Follow up on quote"],["Deciding",3,"Ask for a decision"],["Appt requested",2,"Check appointment status"],["Confirmed · Won",14,"Post-treatment check-in"],["Lost",null,""]];
const WON=9,LOST=10,SA={3:"docs",5:"plans",6:"quotes",8:"apptReq",9:"won",10:"lost"};
const ACT=[["call","Call"],["wa","WhatsApp"],["pv","Patient visit"],["sv","Sales visit"],["gp","Group post"],["ag","Agent communication"],["bm","B2B meeting"],["bl","B2B lead"],["rl","Reel"],["sp","Social post"]];
const REASONS=["Price too high","Chose another country","Chose another hospital","Not financially ready","Stopped responding","Family decision","Visa / travel issue","Treatment not available","Other"];
const TG=[["calls","Calls"],["fu","Follow-ups"],["visits","Visits"],["apptReq","Appointment Requests"],["gp","B2B Posts"],["ag","Agent Communications"],["rl","Reels"]];
const COL=["#0b5aa8","#0f7f6c","#c27a0e","#a32d2d","#7a5fc7","#8a949e"];
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),D0=s=>new Date(s+"T00:00:00");
const today=()=>iso(new Date()),plus=(n,s)=>{const d=s?D0(s):new Date();d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>s?D0(s).toLocaleDateString("en-GB",{day:"numeric",month:"short"}):"",fmtY=s=>D0(s).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const phone=p=>{let d=String(p||"").replace(/\D/g,"");if(!d)return"";if(d.startsWith("0"))return"60"+d.slice(1);return d};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const DEF=()=>({leads:[],cold:[],corp:[],agents:[],tasks:[],meets:[],acts:[],team:[{id:"u1",name:"Me",role:"Admin"}],set:{country:"Malaysia",hospital:"Sunway Medical Centre",me:"u1",tgt:{calls:60,fu:30,visits:6,apptReq:6,gp:10,ag:20,rl:2}}});
let D=DEF(),view="today",sf="open",P={p:"d",d:today(),rep:""};
try{const s=localStorage.getItem("sunway_lite2"),o=localStorage.getItem("sunway_lite");if(s)D=Object.assign(DEF(),JSON.parse(s));else if(o){const mp=[0,1,4,6,7,9,10];D.leads=JSON.parse(o).map(l=>({...l,stage:mp[l.stage]??0,rep:"u1",created:l.created||today()}))}}catch(e){}
function save(){try{localStorage.setItem("sunway_lite2",JSON.stringify(D))}catch(e){toast("Can’t save here – download a backup")}}
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(window._t);window._t=setTimeout(()=>e.style.display="none",2600)}
const me=()=>D.set.me,rn=id=>(D.team.find(t=>t.id==id)||{}).name||"",get=id=>D.leads.find(x=>x.id==id);
const log=(t,rep,lid)=>D.acts.push({d:today(),ts:new Date().toISOString(),rep:rep||me(),t,lid});
const nt=t=>t=="in"||t=="out"?"call":t; // legacy inbound/outbound/cold-call records count as Call
const note=(l,t)=>l.log.unshift({d:new Date().toISOString().slice(0,16).replace("T"," "),t});
const setNext=l=>{const s=ST[l.stage];if(s[1]==null){l.fu="";l.act=""}else{l.fu=plus(s[1]);l.act=s[2]}};

/* ---------- leads ---------- */
function newLead(o){const l={id:"L"+uid(),name:"",phone:"",country:D.set.country,specialty:"",hospital:D.set.hospital,source:"",partner:"",cost:"",stage:0,fu:"",act:"",lost:"",apptDate:"",recv:"",pay:"",rep:me(),log:[],created:today(),...o};setNext(l);note(l,"Lead created");D.leads.unshift(l);save();return l}
function addLead(){const n=prompt("Patient name?");if(!n)return;const l=newLead({name:n.trim(),phone:prompt("Phone / WhatsApp?")||""});view="leads";sf="open";render();openLead(l.id)}
function setStage(id,i){const l=get(id);if(l.stage==i)return;note(l,"Stage: "+ST[l.stage][0]+" → "+ST[i][0]);l.stage=i;setNext(l);if(SA[i])log(SA[i],l.rep,id);if(i==WON){l.recv=l.recv||"Pending";l.pay=l.pay||(l.partner?"Pending":"N/A")}if(i!=LOST)l.lost="";save();openLead(id);render()}
const setF=(id,k,v)=>{const l=get(id);l[k]=v;save();render()};
function done(id){const l=get(id);note(l,"Done: "+l.act);log("fu",l.rep,id);l.fu=plus(ST[l.stage][1]||2);save();render();toast("Next follow-up "+fmt(l.fu))}
function contact(id,type){const l=get(id),nm=type=="call"?"Call":"WhatsApp";log(type,l.rep,id);note(l,nm+" activity recorded");
if(l.stage<1){note(l,"Stage: "+ST[l.stage][0]+" → "+ST[1][0]);l.stage=1;setNext(l)}
save();render();if($("#dw").className=="on")openLead(id);toast(nm+" activity recorded")}
function snooze(id,n){const l=get(id);l.fu=plus(n);save();render();toast("Snoozed to "+fmt(l.fu))}
function addNote(id){const t=$("#nt").value.trim();if(!t)return;note(get(id),t);save();openLead(id)}
function openLead(id){const l=get(id),f=(k,lb,x="")=>`<label class="f"><span>${lb}</span><input value="${esc(l[k])}" ${x} onchange="setF('${id}','${k}',this.value)"></label>`;
$("#dw").innerHTML=`<p class="sp"><b style="font-size:18px">${esc(l.name)}</b><button class="s" onclick="closeDw()">Close</button></p>
<p>${l.phone?`<button class="s" onclick="contact('${id}','call')">Call</button> <button class="s" onclick="contact('${id}','wa')">WhatsApp</button>`:""}</p>${(()=>{const A=D.acts.filter(x=>x.lid==id),C=A.filter(x=>nt(x.t)=="call"),W=A.filter(x=>x.t=="wa"),last=[...C,...W].map(x=>x.ts||x.d).sort().pop();return `<p class="mu">Calls ${C.length} · WhatsApp ${W.length}${last?" · Last contact "+(last.length>10?new Date(last).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"}):fmt(last)):""}</p>`})()}
<div class="stg">${ST.map((s,i)=>`<button class="s ${l.stage==i?"on":""}" onclick="setStage('${id}',${i})">${s[0]}</button>`).join("")}</div>
${l.stage==LOST?sel(id,"lost","Lost reason",["",...REASONS],l.lost):`<div class="two">${f("act","Next action")}${f("fu","Due","type=date")}</div>`}
<div class="two">${f("name","Name")}${f("phone","Phone","type=tel")}${f("country","Country","list=dl-country")}${f("hospital","Hospital","list=dl-hospital")}${f("specialty","Specialty","list=dl-specialty")}${f("source","Source","list=dl-source")}${f("partner","B2B agent","list=dl-partner")}${f("cost","Est. cost","")}${f("apptDate","Appointment date","type=date")}<label class="f"><span>Assigned to</span><select onchange="setF('${id}','rep',this.value)">${D.team.map(t=>`<option value="${t.id}" ${l.rep==t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select></label></div>
<h2>Notes</h2><div style="display:flex;gap:6px"><input id="nt" style="flex:1" placeholder="Add a note…" onkeydown="if(event.key=='Enter')addNote('${id}')"><button class="p" onclick="addNote('${id}')">Add</button></div>
<div class="log">${l.log.map(x=>`<div><span class="mu">${x.d}</span><br>${esc(x.t)}</div>`).join("")}</div>
<p><button class="s" style="color:var(--rd)" onclick="if(confirm('Delete lead?')){D.leads=D.leads.filter(x=>x.id!='${id}');save();closeDw();render()}">Delete lead</button></p>`;$("#dw").className="on"}
const closeDw=()=>$("#dw").className="";
const sel=(id,k,lb,opts,v)=>`<label class="f"><span>${lb}</span><select onchange="setF('${id}','${k}',this.value)">${opts.map(o=>`<option ${v==o?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
const act=l=>l.stage!=LOST&&l.stage!=WON;
function card(l,due){const od=l.fu&&l.fu<today();return `<div class="card it"><div class="g" onclick="openLead('${l.id}')"><b>${esc(l.name)}</b> <span class="tag">${ST[l.stage][0]}</span><br><span class="mu">${esc(l.act||"—")}${due&&l.fu?` · <span class="${od?"tag r":""}">${fmt(l.fu)}</span>`:""}${l.partner?" · via "+esc(l.partner):""} · ${esc(rn(l.rep))}</span></div>
${due&&l.fu?`<button class="s p" onclick="done('${l.id}')">Done</button><button class="s" onclick="snooze('${l.id}',1)">+1d</button><button class="s" onclick="snooze('${l.id}',3)">+3d</button>`:""}${l.phone?`<button class="s" onclick="contact('${l.id}','wa')">WA</button>`:""}</div>`}

/* ---------- generic records ---------- */
const EN={
cold:{t:"Cold calls",l:"contact",f:[["name","Name"],["company","Company / organisation"],["phone","Phone","tel"],["status","Status","sel:To call|Called|Callback|Interested|Not interested|Converted"],["next","Next call","date"],["rep","Owner","rep"],["notes","Notes","area"]],s:r=>[r.company,r.status,r.next&&"next "+fmt(r.next),rn(r.rep)],x:r=>`<button class="s" onclick="callLog('${r.id}')">Log call</button><button class="s" onclick="toLead('${r.id}')">→ Lead</button>`},
corp:{t:"Corporate",l:"corporate account",f:[["company","Company"],["contact","Contact person"],["phone","Phone","tel"],["status","Status","sel:Prospect|Contacted|Meeting|Proposal|MOU signed|Inactive"],["next","Next step date","date"],["rep","Owner","rep"],["notes","Notes","area"]],s:r=>[r.contact,r.status,r.next&&"next "+fmt(r.next),rn(r.rep)]},
agents:{t:"B2B agents",l:"agent",f:[["name","Agent / company"],["contact","Contact person"],["phone","Phone","tel"],["country","Country"],["mou","MOU","sel:None|Draft|Signed|Expired"],["notes","Notes","area"]],s:r=>{const L=D.leads.filter(l=>l.partner==r.name);return[r.contact,"MOU: "+(r.mou||"None"),L.length+" leads",L.filter(l=>l.stage==WON).length+" won"]},x:r=>r.phone?`<button class="s" onclick="log('ag');save();render();toast('Agent communication recorded')">WA</button>`:""},
tasks:{t:"Tasks",l:"task",f:[["title","Task"],["due","Due","date"],["rep","Assigned to","rep"],["done","Completed","chk"]],s:r=>[r.due&&"due "+fmt(r.due),rn(r.rep)],c:r=>`<input type="checkbox" ${r.done?"checked":""} onchange="tog('tasks','${r.id}')" aria-label="Done">`},
meets:{t:"Meetings",l:"meeting",f:[["title","Meeting"],["date","Date","date"],["type","With","sel:Sunway Malaysia team|B2B agent|Corporate|Other"],["notes","Notes / minutes","area"],["done","Held","chk"]],s:r=>[r.date&&fmt(r.date),r.type,r.done?"held":""],c:r=>`<input type="checkbox" ${r.done?"checked":""} onchange="tog('meets','${r.id}')" aria-label="Held">`},
team:{t:"Team",l:"team member",f:[["name","Name"],["role","Role","sel:Sales rep|Manager|Admin"],["phone","Phone","tel"]],s:r=>[r.role,r.phone]}};
function gl(e){const E=EN[e],q=$("#q").value.toLowerCase(),r=D[e].filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));
if(e=="tasks")r.sort((a,b)=>(!!a.done-!!b.done)||(a.due||"9").localeCompare(b.due||"9"));if(e=="meets")r.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
return `<p class="sp"><b style="font-size:18px">${E.t}</b><button class="p s" onclick="openForm('${e}')">+ New</button></p>`+(r.map(x=>`<div class="card it">${E.c?E.c(x):""}<div class="g" onclick="openForm('${e}','${x.id}')"><b>${esc(x[E.f[0][0]])}</b><br><span class="mu">${E.s(x).filter(Boolean).map(esc).join(" · ")}</span></div>${E.x?E.x(x):""}</div>`).join("")||`<p class="mu">Nothing here yet.</p>`)}
function openForm(e,id){const E=EN[e],r=id?D[e].find(x=>x.id==id):{rep:me()};
$("#dw").innerHTML=`<p class="sp"><b>${id?"Edit":"New"} ${E.l}</b><button class="s" onclick="closeDw()">Close</button></p>`+E.f.map(([k,lb,ty="text"])=>{const v=r[k]??"";
const c=ty=="area"?`<textarea rows=3 data-k="${k}">${esc(v)}</textarea>`:ty=="chk"?`<input type="checkbox" data-k="${k}" ${v?"checked":""}>`:ty=="rep"?`<select data-k="${k}">${D.team.map(t=>`<option value="${t.id}" ${v==t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select>`:ty.startsWith("sel:")?`<select data-k="${k}">${ty.slice(4).split("|").map((o,i)=>`<option ${(v||ty.slice(4).split("|")[0])==o?"selected":""}>${o}</option>`).join("")}</select>`:`<input data-k="${k}" type="${ty}" value="${esc(v)}">`;
return `<label class="f"><span>${lb}</span>${c}</label>`}).join("")+`<p style="display:flex;gap:8px"><button class="p" onclick="saveRec('${e}','${id||""}')">Save</button>${id?`<button style="color:var(--rd)" onclick="delRec('${e}','${id}')">Delete</button>`:""}</p>`;$("#dw").className="on"}
function saveRec(e,id){const o=id?D[e].find(x=>x.id==id):{id:uid()};document.querySelectorAll("#dw [data-k]").forEach(i=>o[i.dataset.k]=i.type=="checkbox"?i.checked:i.value);if(!o[EN[e].f[0][0]].trim())return toast("Name is required");if(!id)D[e].unshift(o);save();closeDw();render()}
function delRec(e,id){if(e=="team"&&D.team.length<2)return toast("Keep at least one team member");if(confirm("Delete?")){D[e]=D[e].filter(x=>x.id!=id);if(e=="team"&&!D.team.find(t=>t.id==me()))D.set.me=D.team[0].id;save();closeDw();render()}}
function tog(e,id){const r=D[e].find(x=>x.id==id);r.done=!r.done;if(e=="meets"&&r.done&&r.type=="B2B agent")log("bm");save();render()}
function callLog(id){const r=D.cold.find(x=>x.id==id);log("call",r.rep);if(r.status=="To call")r.status="Called";save();render();toast("Call activity recorded")}
function toLead(id){const r=D.cold.find(x=>x.id==id);newLead({name:r.name,phone:r.phone,source:"Cold call",rep:r.rep});r.status="Converted";save();toast("Lead created");render()}

/* ---------- metrics ---------- */
const days=(a,b)=>{const o=[];for(let d=a;d<=b;d=plus(1,d))o.push(d);return o};
function rng(p,d){if(p=="d")return[d,d];if(p=="w"){const x=D0(d),k=(x.getDay()+6)%7,a=plus(-k,d);return[a,plus(6,a)]}return[d.slice(0,8)+"01",iso(new Date(+d.slice(0,4),+d.slice(5,7),0))]}
const KEYS=["fu","apptReq","won","docs","plans","quotes","lost","in","out",...ACT.map(a=>a[0])];
function met(a,b,rep){const A=D.acts.filter(x=>x.d>=a&&x.d<=b&&(!rep||x.rep==rep)),N=D.leads.filter(l=>l.created>=a&&l.created<=b&&(!rep||l.rep==rep)),m={nl:N.length,as:N.filter(l=>l.rep).length};KEYS.forEach(k=>m[k]=A.filter(x=>x.t==k).length);m.calls=m.in+m.out+m.call;m.visits=m.pv+m.sv;return m}
const pend=rep=>{const L=D.leads.filter(l=>!rep||l.rep==rep);return{od:L.filter(l=>act(l)&&l.fu&&l.fu<today()).length,docs:L.filter(l=>l.stage==2).length,appt:L.filter(l=>l.stage==8).length}};
function repText(p,d,rep){const[a,b]=rng(p,d),m=met(a,b,rep),n=days(a,b).length,T=D.set.tgt,pd=pend(rep),
dt=p=="d"?fmtY(a):p=="w"?fmtY(a)+" – "+fmtY(b):D0(a).toLocaleDateString("en-GB",{month:"long",year:"numeric"}),
tg=(lb,k)=>{const t=(+T[k]||0)*n;return `• ${lb}: ${m[k]}/${t} — ${t?Math.round(m[k]/t*100):0}%`};
return `📊 ${{d:"DAILY",w:"WEEKLY",m:"MONTHLY"}[p]} SALES REPORT
${p=="d"?"Date":"Period"}: ${dt}
Sales Rep: ${rep?rn(rep):"All sales reps"}

🎯 LEAD PERFORMANCE
• New Leads: ${m.nl}

/* ---------- charts ---------- */
function col(v,lb,c=0){const mx=Math.max(1,...v),w=300/v.length;return `<svg viewBox="0 0 300 100" width="100%" role="img" aria-label="Column chart">${v.map((x,i)=>`<rect x="${i*w+1}" y="${84-x/mx*78}" width="${Math.max(2,w-3)}" height="${x/mx*78}" rx="2" fill="${COL[c]}"><title>${lb[i]}: ${x}</title></rect>`).join("")}<text x="0" y="98" font-size="8" fill="var(--mu)">${lb[0]}</text><text x="300" y="98" font-size="8" text-anchor="end" fill="var(--mu)">${lb[lb.length-1]}</text><text x="300" y="8" font-size="9" text-anchor="end" fill="var(--mu)">max ${mx}</text></svg>`}
function hb(e){const mx=Math.max(1,...e.map(x=>x[1]));return e.length?e.map(([k,v])=>`<div class="br"><span>${esc(k)}</span><div class="bar"><i style="width:${v/mx*100}%"></i></div><b>${v}</b></div>`).join(""):`<p class="mu">No data yet</p>`}
function donut(e){const t=e.reduce((s,x)=>s+x[1],0);if(!t)return`<p class="mu">No data yet</p>`;let o=0;const C=2*Math.PI*40;
return `<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 100 100" width="130" role="img" aria-label="Donut chart">${e.map((x,i)=>{const l=x[1]/t*C,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${COL[i%6]}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 50 50)"><title>${esc(x[0])}: ${x[1]}</title></circle>`;o+=l;return s}).join("")}</svg><div class="lg" style="flex-direction:column;gap:3px">${e.map((x,i)=>`<span><i style="background:${COL[i%6]}"></i>${esc(x[0])} · ${x[1]} (${Math.round(x[1]/t*100)}%)</span>`).join("")}</div></div>`}
const grp=(L,k)=>{const m={};L.forEach(l=>{const v=l[k]||"—";m[v]=(m[v]||0)+1});const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);return e.length>6?[...e.slice(0,5),["Other",e.slice(5).reduce((s,x)=>s+x[1],0)]]:e};

/* ---------- views ---------- */
function todayV(){const t=today(),a=D.leads.filter(l=>act(l)&&l.fu).sort((x,y)=>x.fu.localeCompare(y.fu)),od=a.filter(l=>l.fu<t),dt=a.filter(l=>l.fu==t),up=a.filter(l=>l.fu>t&&l.fu<=plus(7)),post=D.leads.filter(l=>l.stage==WON&&l.fu&&l.fu<=t),
tk=D.tasks.filter(x=>!x.done&&x.due&&x.due<=t),mt=D.meets.filter(x=>!x.done&&x.date&&x.date>=t&&x.date<=plus(3)),
mine=D.acts.filter(x=>x.d==t&&x.rep==me()),
sec=(h,x)=>x.length?`<h2>${h} (${x.length})</h2>`+x.map(l=>card(l,1)).join(""):"";
return `<div class="kp"><div class="card"><b style="color:${od.length?"var(--rd)":"inherit"}">${od.length}</b><span class="mu">Overdue</span></div><div class="card"><b>${dt.length}</b><span class="mu">Due today</span></div><div class="card"><b>${D.leads.filter(act).length}</b><span class="mu">Active leads</span></div><div class="card"><b>${tk.length}</b><span class="mu">Tasks due</span></div></div>
<h2>Log today’s activity (${esc(rn(me()))})</h2><div class="g2" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${ACT.map(([k,l])=>`<div class="tl"><span>${l}</span><div><button class="s" onclick="adj('${k}',-1)" aria-label="Minus">−</button><b>${mine.filter(x=>nt(x.t)==k).length}</b><button class="s p" onclick="adj('${k}',1)" aria-label="Plus">+</button></div></div>`).join("")}</div>
${sec("Overdue follow-ups",od)}${sec("Follow-ups today",dt)}${sec("Post-treatment check-ins",post)}
${tk.length?`<h2>Tasks due (${tk.length})</h2>`+tk.map(x=>`<div class="card it"><input type="checkbox" onchange="tog('tasks','${x.id}')"><div class="g" onclick="openForm('tasks','${x.id}')">${esc(x.title)} <span class="mu">· ${fmt(x.due)}</span></div></div>`).join(""):""}
${mt.length?`<h2>Upcoming meetings</h2>`+mt.map(x=>`<div class="card it"><div class="g" onclick="openForm('meets','${x.id}')"><b>${esc(x.title)}</b><br><span class="mu">${fmt(x.date)} · ${esc(x.type)}</span></div></div>`).join(""):""}${sec("Next 7 days",up)}`}
function adj(k,n){if(n>0)log(k);else{const i=D.acts.map((x,j)=>x.d==today()&&x.rep==me()&&nt(x.t)==k?j:-1).filter(j=>j>=0).pop();if(i!=null)D.acts.splice(i,1)}save();render()}
function leadsV(){const q=$("#q").value.toLowerCase().trim();let r=D.leads.filter(l=>sf=="open"?act(l):sf=="all"||l.stage==+sf);if(q)r=D.leads.filter(l=>[l.name,l.phone,l.country,l.hospital,l.partner,l.specialty].join(" ").toLowerCase().includes(q));
return `<div class="chips">${[["open","Active"],...ST.map((s,i)=>[i,s[0]]),["all","All"]].map(([k,n])=>`<button class="s ${sf==k?"on":""}" onclick="sf='${k}';render()">${n}${typeof k=="number"?" "+D.leads.filter(l=>l.stage==k).length:""}</button>`).join("")}</div>`+(r.map(l=>card(l,l.stage!=LOST)).join("")||`<p class="mu">No leads found.</p>`)}
function finV(){const W=D.leads.filter(l=>l.stage==WON),c=(k,v)=>W.filter(l=>l[k]==v).length;
const s=(l,k,o)=>`<select onchange="setF('${l.id}','${k}',this.value)" aria-label="${k}">${o.map(x=>`<option ${l[k]==x?"selected":""}>${x}</option>`).join("")}</select>`;
return `<p class="mu">Confirmed appointments / closed-won leads only. Status tracking, no amounts.</p><div class="kp"><div class="card"><b>${W.length}</b><span class="mu">Confirmed</span></div><div class="card"><b>${c("recv","Pending")+c("recv","Invoiced")}</b><span class="mu">Receivable open</span></div><div class="card"><b>${c("recv","Received")}</b><span class="mu">Received</span></div><div class="card"><b>${c("pay","Pending")}</b><span class="mu">Payable to agents</span></div></div>
<h2>Receivable (from hospital) &amp; payable (to B2B agent)</h2><div class="card" style="overflow-x:auto"><table><tr><th>Patient</th><th>Appt</th><th>Receivable</th><th>Agent</th><th>Payable</th></tr>${W.map(l=>`<tr><td><a href="#" onclick="openLead('${l.id}');return false">${esc(l.name)}</a></td><td>${fmt(l.apptDate)||"—"}</td><td>${s(l,"recv",["Pending","Invoiced","Received"])}</td><td>${esc(l.partner)||"—"}</td><td>${l.partner?s(l,"pay",["Pending","Paid"]):"—"}</td></tr>`).join("")||`<tr><td colspan=5 class="mu">No confirmed leads yet.</td></tr>`}</table></div>`}
function perfV(){const[a,b]=rng(P.p,P.d),m=met(a,b,P.rep),ds=days(a,b),n=ds.length,series=k=>ds.map(d=>k=="nl"?met(d,d,P.rep).nl:met(d,d,P.rep)[k]),lb=ds.map(fmt),txt=repText(P.p,P.d,P.rep);
return `<div class="chips" style="align-items:center">${[["d","Daily"],["w","Weekly"],["m","Monthly"]].map(([k,l])=>`<button class="s ${P.p==k?"on":""}" onclick="P.p='${k}';render()">${l}</button>`).join("")}<input type="date" value="${P.d}" onchange="P.d=this.value||today();render()"><select onchange="P.rep=this.value;render()" aria-label="Rep"><option value="">All reps</option>${D.team.map(t=>`<option value="${t.id}" ${P.rep==t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select></div>
<div class="kp">${[["New leads",m.nl],["Calls",m.calls],["WhatsApp",m.wa],["Follow-ups",m.fu],["Appt requests",m.apptReq],["Closed won",m.won],["Closed lost",m.lost]].map(([l,v])=>`<div class="card"><b>${v}</b><span class="mu">${l}</span></div>`).join("")}</div>
<h2>Target achievement</h2><div class="card">${TG.map(([k,l])=>{const t=(+D.set.tgt[k]||0)*n,p=t?Math.min(100,Math.round(m[k]/t*100)):0;return `<div class="br"><span>${l}</span><div class="bar"><i style="width:${p}%"></i></div><b>${m[k]}/${t}</b></div>`}).join("")}</div>
<h2>Trends</h2><div class="g2"><div class="card"><span class="mu">New leads</span>${col(series("nl"),lb,0)}</div><div class="card"><span class="mu">Calls</span>${col(series("calls"),lb,1)}</div><div class="card"><span class="mu">Follow-ups</span>${col(series("fu"),lb,2)}</div></div>
<h2>By team member</h2><div class="card" style="overflow-x:auto"><table><tr><th>Rep</th><th>Leads</th><th>Calls</th><th>Follow-ups</th><th>Visits</th><th>Won</th></tr>${D.team.map(t=>{const x=met(a,b,t.id);return `<tr><td>${esc(t.name)}</td><td>${x.nl}</td><td>${x.calls}</td><td>${x.fu}</td><td>${x.visits}</td><td>${x.won}</td></tr>`}).join("")}</table></div>
<h2>Report</h2><div class="card"><pre id="rt">${esc(txt)}</pre><p style="display:flex;gap:8px;margin-bottom:0"><button class="p" onclick="navigator.clipboard.writeText($('#rt').textContent).then(()=>toast('Report copied'),()=>toast('Copy failed'))">Copy</button><a target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}"><button>Send on WhatsApp</button></a></p></div>`}
function anaV(){const L=D.leads,mo=[...Array(6)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-5+i,1);return iso(d).slice(0,7)}),n=L.length,w=L.filter(l=>l.stage==WON).length;
return `<div class="kp"><div class="card"><b>${n}</b><span class="mu">Total leads</span></div><div class="card"><b>${w}</b><span class="mu">Won</span></div><div class="card"><b>${n?Math.round(w/n*100):0}%</b><span class="mu">Conversion</span></div><div class="card"><b>${L.filter(l=>l.stage==LOST).length}</b><span class="mu">Lost</span></div></div>
<h2>Pipeline funnel</h2><div class="card">${hb(ST.map((s,i)=>[s[0],L.filter(l=>l.stage==i).length]))}</div>
<div class="g2"><div><h2>Lead sources</h2><div class="card">${donut(grp(L,"source"))}</div></div><div><h2>Countries</h2><div class="card">${donut(grp(L,"country"))}</div></div><div><h2>Specialties</h2><div class="card">${donut(grp(L,"specialty"))}</div></div><div><h2>Lost reasons</h2><div class="card">${donut(grp(L.filter(l=>l.stage==LOST),"lost"))}</div></div></div>
<div class="g2"><div><h2>New leads / month</h2><div class="card">${col(mo.map(m=>L.filter(l=>l.created.startsWith(m)).length),mo,0)}</div></div><div><h2>Won / month</h2><div class="card">${col(mo.map(m=>D.acts.filter(x=>x.t=="won"&&x.d.startsWith(m)).length),mo,1)}</div></div></div>
<h2>B2B agents (leads)</h2><div class="card">${hb(grp(L.filter(l=>l.partner),"partner"))}</div>`}
function setV(){const T=D.set.tgt;return `<h2>Defaults</h2><div class="card two"><label class="f"><span>Default country</span><input value="${esc(D.set.country)}" onchange="D.set.country=this.value;save()"></label><label class="f"><span>Default hospital</span><input value="${esc(D.set.hospital)}" onchange="D.set.hospital=this.value;save()"></label></div>
<h2>Daily targets (weekly / monthly multiply by days)</h2><div class="card two">${TG.map(([k,l])=>`<label class="f"><span>${l}</span><input type="number" min="0" value="${T[k]}" onchange="D.set.tgt['${k}']=+this.value;save()"></label>`).join("")}</div>
${gl("team")}
<h2>Data</h2><div class="card it"><button onclick="exp()">Download backup</button><button onclick="$('#imp').click()">Restore backup</button><input id="imp" type="file" accept=".json" hidden onchange="imp(this)"><button style="color:var(--rd)" onclick="if(confirm('Erase ALL data?')){D=DEF();save();render()}">Erase all</button><span class="mu">Data lives in this browser only. Back up weekly.</span></div>`}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D)]));a.download="sunway-backup.json";a.click()}
function imp(i){const f=i.files[0];if(f)f.text().then(t=>{try{const d=JSON.parse(t);if(!d.leads)throw 0;if(confirm("Replace all data with this backup?")){D=Object.assign(DEF(),d);save();render()}}catch(e){toast("Not a valid backup")}})}

/* ---------- shell ---------- */
const NAV=[["today","Today"],["leads","Leads"],["cold","Cold calls"],["corp","Corporate"],["agents","B2B"],["tasks","Tasks"],["meets","Meetings"],["fin","Finance"],["perf","Performance"],["ana","Analytics"],["set","Settings"]];
const VW={today:todayV,leads:leadsV,cold:()=>gl("cold"),corp:()=>gl("corp"),agents:()=>gl("agents"),tasks:()=>gl("tasks"),meets:()=>gl("meets"),fin:finV,perf:perfV,ana:anaV,set:setV};
function render(){$("#nv").innerHTML=NAV.map(([k,l])=>`<button class="${view==k?"on":""}" onclick="view='${k}';render()">${l}</button>`).join("");
$("#me").innerHTML=D.team.map(t=>`<option value="${t.id}" ${me()==t.id?"selected":""}>${esc(t.name)}</option>`).join("");
$("#m").innerHTML=VW[view]();
[["country","country"],["specialty","specialty"],["hospital","hospital"],["source","source"],["partner","partner"]].forEach(([k,id])=>$("#dl-"+id).innerHTML=[...new Set([...D.leads.map(l=>l[k]),...(k=="partner"?D.agents.map(a=>a.name):[])].filter(Boolean))].sort().map(v=>`<option value="${esc(v)}">`).join(""))}
$("#q").addEventListener("input",()=>render());document.addEventListener("keydown",e=>{if(e.key=="Escape")closeDw()});
render();
</script></body></html>
