<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shantir Neer Accounts</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2733;--mute:#66758a;--line:#dde3ea;--pri:#0f6b6b;--pri-d:#0a4f4f;--pri-l:#e3f2f1;--red:#b3261e;--red-l:#fdecea;--amb:#8a5a00;--amb-l:#fff4d6;--grn:#1b7a3d;--grn-l:#e5f5ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif}
header.top{background:var(--pri-d);color:#fff;position:sticky;top:0;z-index:20}
.topin{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;letter-spacing:.2px}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.75}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#cfe6e4;padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button:hover{background:rgba(255,255,255,.1)}
nav button.on{background:#fff;color:var(--pri-d);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:16px}
h2{margin:0 0 4px;font-size:22px}
h3{margin:0 0 8px;font-size:16px}
.sub{color:var(--mute);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .l{color:var(--mute);font-size:13px}
.stat .v{font-size:24px;font-weight:700;margin-top:2px}
.stat .n{font-size:12px;color:var(--mute);margin-top:2px}
.neg{color:var(--red)}.pos{color:var(--grn)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);background:#fafbfc}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;background:#fafbfc}
.scroll{overflow-x:auto}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{background:#f0f3f6}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.pri:hover{background:var(--pri-d)}
button.sm{padding:3px 8px;font-size:13px}
button.danger{color:var(--red)}
button.ghost{background:transparent}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #c4ceda;border-radius:8px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mute)}
label input,label select,label textarea{margin-top:3px;color:var(--ink);font-size:15px}
label.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px}
label.chk input{width:auto;margin:0}
.mpick{display:flex;gap:6px;align-items:center}
.mpick input{width:auto}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:#eef1f5;color:#44546a}
.tag.g{background:var(--grn-l);color:var(--grn)}.tag.r{background:var(--red-l);color:var(--red)}.tag.a{background:var(--amb-l);color:var(--amb)}
.note{background:var(--amb-l);color:#5c3d00;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.empty{color:var(--mute);padding:14px;text-align:center}
.ov{position:fixed;inset:0;background:rgba(15,25,35,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.dlg{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:520px}
.dlg.wide{max-width:760px}
.dlg .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.dlg .grid .full{grid-column:1/-1}
.btns{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c2733;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;display:none}
details.fund summary{cursor:pointer;color:var(--pri);font-weight:600;margin:8px 0}
.bar{height:8px;background:#e8edf2;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
/* ---------- report ---------- */
.report{--brick:#c2622f;--brick-d:#8f4521;--brick-l:#fbefe7;--sky:#99c6f7;background:#fff;color:#2b2420;max-width:820px;margin:0 auto 24px;padding:26px 28px;border:1px solid var(--line);border-top:5px solid var(--brick);border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.06);font-size:14px}
.report .rhead{text-align:center;padding-bottom:12px;border-bottom:1px solid #ecd9cc;margin-bottom:12px}
.report .rlogo{width:64px;height:68px;object-fit:cover;border-radius:10px;border:2px solid var(--brick);display:block;margin:0 auto 8px}
.report h1{margin:0;font-size:30px;line-height:1.2;color:var(--brick-d);font-family:"Noto Sans Bengali","Kalpurush","Nirmala UI","Shonar Bangla","Vrinda",system-ui,sans-serif;font-weight:700}
.report .ren{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#7a6a60;margin-top:2px}
.report .rsub{text-align:center;color:#2b2420;margin:8px 0 4px}
.report .rsub b{display:inline-block;background:var(--brick-l);color:var(--brick-d);border-radius:99px;padding:3px 14px;font-size:13px}
.report h4{margin:18px 0 6px;font-size:14px;color:var(--brick-d);border-bottom:2px solid var(--brick);padding-bottom:3px}
.report table{margin-bottom:6px}
.report th{background:var(--brick-l);color:var(--brick-d);font-size:11px}
.report td,.report th{padding:6px 8px;border-bottom:1px solid #eadfd6}
.report .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.report .kpi{border:1px solid #ecd9cc;border-top:3px solid var(--sky);border-radius:8px;padding:8px;text-align:center;background:#fff}
.report .kpi:last-child{border-top-color:var(--brick);background:var(--brick-l)}
.report .kpi b{display:block;font-size:16px;margin-top:2px}
.report .kpi span{font-size:11px;color:#6b5c52}
.report tr.tot td{background:var(--brick-l);color:var(--brick-d);border-bottom:2px solid var(--brick)}
.report .small td,.report .small th{font-size:13px}
.report td .nt{display:block;font-size:11px;color:#7a6a60}
.report .muted{color:#6b5c52}
.report .gen{text-align:center;margin:14px 0 0;font-size:11px;color:#7a6a60}
@page{size:A4;margin:12mm}
@media print{
  body{background:#fff}
  .no-print,header.top,#toast{display:none!important}
  main{padding:0;max-width:none}
  .report{border:0;border-top:5px solid #c2622f;border-radius:0;box-shadow:none;margin:0;padding:10px 0 0;max-width:none}
  .report{font-size:12.5px}
  .report h1{font-size:26px}
  .report .rlogo{width:52px;height:56px;margin-bottom:4px}
  .report .rhead{padding-bottom:8px;margin-bottom:8px}
  .report .kpis{margin:8px 0}
  .report td,.report th{padding:3px 8px}
  .report .small td,.report .small th{font-size:12px}
  .report h4{margin:12px 0 4px;break-after:avoid}
  .report tr,.report .kpis{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:640px){
  .dlg .grid{grid-template-columns:1fr}
  main{padding:10px}
  .report{padding:16px 12px;font-size:14px}
  .report h1{font-size:26px}
  .report .kpis{grid-template-columns:1fr 1fr}
  .report .kpi b{font-size:15px}
  .report td,.report th{padding:7px 5px}
  .scroll{-webkit-overflow-scrolling:touch}
  .row>button,.row .mpick{flex:1 1 auto}
}
.bdg{background:#e53935;color:#fff;border-radius:99px;padding:0 6px;font-size:11px;margin-left:5px}
.bimg{height:40px;width:30px;object-fit:cover;border-radius:5px;vertical-align:middle;margin-right:8px;border:1px solid rgba(255,255,255,.4)}
.hero{height:130px;border-radius:12px;background-size:cover;background-position:center 30%;margin-bottom:14px;position:relative;overflow:hidden}
.hero div{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,79,79,.92),rgba(10,79,79,.35));color:#fff;padding:18px 20px}
.hero b{font-size:22px;display:block}.hero span{opacity:.85;font-size:13px}
.note.ok{background:var(--grn-l);color:#124d27}
@media print{.hero{display:none}}

/* larger text for readability (esp. on phones) */
body{font-size:16px}
label,.stat .l{font-size:14px}
.stat .n,.tag,.brand small,.hero span{font-size:13px}
th{font-size:13px}
button.sm{font-size:14px}
@media(max-width:640px){
  body{font-size:18px;line-height:1.5}
  .brand{font-size:21px}
  .brand small{font-size:14px}
  nav button{font-size:17px;padding:10px 14px}
  h2{font-size:26px}
  h3{font-size:19px}
  label,label.chk,.stat .l{font-size:16px}
  label input,label select,label textarea,input,select,textarea{font-size:18px;padding:11px 12px}
  button,.btn{font-size:17px;padding:10px 14px}
  button.sm{font-size:16px;padding:7px 11px}
  th{font-size:14px}
  th,td{padding:10px 8px}
  .stat .v{font-size:28px}
  .stat .n,.tag,.note,.hero span{font-size:15px}
  .tag{padding:2px 9px}
  .dlg{padding:16px}
  .dlg h3{font-size:21px}
  .report{font-size:16px}
  .report th{font-size:13px}
  .report h4{font-size:16px}
  .report .kpi b{font-size:17px}
  #toast{font-size:17px}
}
@media print{body{font-size:15px}.report{font-size:14px}}
</style>
</head>
<body>
<header class="top no-print"><div class="topin">
  <div class="brand" id="brand">Shantir Neer<small>Building accounts</small></div>
  <nav id="nav"></nav>
</div></header>
<main id="app"></main>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const thisMonth=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const today=()=>thisMonth()+'-'+pad(new Date().getDate());
const lastDay=m=>{const [y,mm]=m.split('-').map(Number);return m+'-'+pad(new Date(y,mm,0).getDate())};
const defaultDate=m=>m===thisMonth()?today():lastDay(m);
const mOf=d=>(d||'').slice(0,7);
const mLabel=m=>{const [y,mm]=m.split('-').map(Number);return new Date(y,mm-1,1).toLocaleString('en-GB',{month:'long',year:'numeric'})};
const addM=(m,k)=>{let [y,mm]=m.split('-').map(Number);mm+=k;y+=Math.floor((mm-1)/12);mm=((mm-1)%12+12)%12+1;return y+'-'+pad(mm)};
const dFmt=d=>{if(!d)return'';const [y,m,dd]=d.split('-');return dd+'/'+m+'/'+y};
const toU=d=>{const [y,m,dd]=d.split('-').map(Number);return Date.UTC(y,m-1,dd)};
const dayCount=(a,b)=>Math.round((toU(b)-toU(a))/864e5)+1;
const leaveDaysIn=(l,m)=>{const s=l.from>m+'-01'?l.from:m+'-01',e=l.to<lastDay(m)?l.to:lastDay(m);return e<s?0:dayCount(s,e)};
const leaveDaysYear=(l,y)=>{const s=l.from>y+'-01-01'?l.from:y+'-01-01',e=l.to<y+'-12-31'?l.to:y+'-12-31';return e<s?0:dayCount(s,e)};
const num=v=>Number(v)||0;
const money=n=>{n=Math.round(num(n)*100)/100;return (n<0?'−':'')+Math.abs(n).toLocaleString('en-IN')};
const cur=n=>db.settings.currency+' '+money(n);
const sumOf=(a,f=x=>x.amount)=>a.reduce((t,x)=>t+num(f(x)),0);
const BODLI='Bodli Darowan';
const TYPES={service:'Service charge',extra:'Extra collection',special:'Special fund',garage:'Car garage rent',bike:'Bike stand rent',other:'Other income'};
const LEAVE_TYPES=['Casual','Sick','Annual','Unpaid','Other'];

const DBV=6;

let storageOK=true;
function migrate(d){
  const df=defaults(),ver=d.v||1,s=d.settings||{};
  const out=Object.assign(df,d,{settings:Object.assign(df.settings,s),rem:Object.assign(df.rem,d.rem||{})});
  ['collections','expenses','leaves','advances','advRec','funds','staff','imports','remLog','expected'].forEach(k=>{if(!Array.isArray(out[k]))out[k]=[]});
  ['notes','checks','snooze','dismissed','dailyLog','monthReview','recon'].forEach(k=>{if(!out[k]||typeof out[k]!=='object'||Array.isArray(out[k]))out[k]={}});
  if(ver<2){
    if(s.startMonth&&s.startMonth!=='2026-04'){out.settings.legacy={startMonth:s.startMonth,openingBalance:num(s.openingBalance)};out.settings.startMonth='2026-04';out.settings.openingBalance=0}
    out.settings.balanceVerified=false;out.rem.trackFrom=today();
  }
  if(ver<3){if(out.settings.startMonth!=='2025-09'){out.settings.legacy={startMonth:out.settings.startMonth,openingBalance:num(out.settings.openingBalance)};out.settings.startMonth='2025-09';out.settings.openingBalance=0;out.settings.balanceVerified=false}out.staff.forEach(x=>{if(x.role==='Guard')x.allowance=10})}
  if(ver<4)out.staff.forEach(x=>{const n={'Guard 1':'Halim','Guard 2':'Arif'}[x.name];if(n)renStaff(x.name,n,out.expenses),x.name=n});
  if(ver<5){out.leaves.forEach(l=>{l.expenseId='';l.tempName=''});out.expenses.forEach(e=>{delete e.leaveId})}
  if(ver<6){
    const ren={'Didar Bhai':'দিদার ভাই পার্কিং ভাড়া','Mukta Chachi':'মুক্তা চাচী পার্কিং ভাড়া'};
    out.expenses.forEach(e=>{if(ren[e.category])e.category=ren[e.category]});
    (out.settings.recurring||[]).forEach(r=>{if(ren[r.category])r.category=ren[r.category]});
    out.expected.forEach(x=>{if(ren[x.category])x.category=ren[x.category]});
    out.expenses.forEach(e=>{if(isBill(e.category)&&!e.billMonth)e.billMonth=addM(mOf(e.date),-1)});
  }
  out.v=DBV;return out}

    if((d.v||1)<DBV){const bk=KEY+'_backup_v'+(d.v||1)+'_'+today();
      try{localStorage.setItem(bk,raw);migrated={ok:true,bk}}catch(e){migrated={ok:false,raw}}}
    return migrate(d)}}
  catch(e){storageOK=false;if(raw){try{localStorage.setItem(KEY+'_unreadable_'+Date.now(),raw)}catch(x){}migrated={ok:false,raw}}}
  return defaults();
}

function rateFor(m){const r=[...db.settings.rates].sort((a,b)=>a.from<b.from?-1:1);let a=r.length?num(r[0].amount):0;for(const x of r)if(x.from<=m)a=num(x.amount);return a}
const fm=c=>c.forMonth||mOf(c.date);
const svcPaid=(flat,m)=>sumOf(db.collections.filter(c=>c.type==='service'&&c.from===flat&&fm(c)===m));
function openingGeneral(m){ // whole ledger: special fund receipts and spending are included
  const s=db.settings,a=num(s.openingBalance);
  if(m>=s.startMonth)return a+netGen(s.startMonth,addM(m,-1));
  return a-netGen(m,addM(s.startMonth,-1)); // earlier months: worked backwards from the verified balance
}
function fundStat(f,upToM){ // cumulative through month inclusive
  const r=sumOf(db.collections.filter(c=>c.fundId===f.id&&(!upToM||mOf(c.date)<=upToM)));
  const s=sumOf(db.expenses.filter(e=>e.fundId===f.id&&(!upToM||mOf(e.date)<=upToM)));
  return{raised:r,spent:s,bal:r-s};
}
function categories(){
  const set=new Set(['Water Bill','Electric Bill','Moila Bill','Lift Service Fee','Internet','Security Gas Cylinder',BODLI,'Eid Bonus','Eid Bokshish','Cleaning Materials','Electric Bulb','LED Light Purchase & Replace','Lift Repair','Repair & Maintenance','Meeting Snacks','Photocopy','Other']);
  db.settings.recurring.forEach(r=>set.add(r.category));
  db.staff.forEach(s=>set.add('Salary - '+s.name));
  db.expenses.forEach(e=>set.add(e.category));
  return [...set].filter(Boolean).sort();
}

function reportHTML(m){
  const s=db.settings;
  const col=db.collections.filter(c=>mOf(c.date)===m&&!c.fundId).sort((a,b)=>a.date<b.date?-1:1);
  const exp=db.expenses.filter(e=>mOf(e.date)===m&&!e.fundId).sort((a,b)=>a.date<b.date?-1:1);
  const by=t=>col.filter(c=>c.type===t);

  const cats={};exp.forEach(e=>{(cats[e.category]=cats[e.category]||{n:0,a:0});cats[e.category].n++;cats[e.category].a+=e.amount});
  const catRows=Object.entries(cats).sort((a,b)=>b[1].a-a[1].a);
  // funds
  const fr=db.funds.filter(f=>mOf(f.date)<=m).map(f=>{
    const cs=db.collections.filter(c=>c.fundId===f.id),es=db.expenses.filter(e=>e.fundId===f.id);
    const rp=sumOf(cs.filter(c=>mOf(c.date)<m)),sp=sumOf(es.filter(e=>mOf(e.date)<m));
    const ri=sumOf(cs.filter(c=>mOf(c.date)===m)),si=sumOf(es.filter(e=>mOf(e.date)===m));
    return{f,open:rp-sp,ri,si,close:rp-sp+ri-si,items:es.filter(e=>mOf(e.date)===m),n:cs.filter(c=>mOf(c.date)===m).length};
  }).filter(x=>x.ri||x.si||x.close!==0||mOf(x.f.date)===m);
  const spOpen=sumOf(fr,x=>x.open),spClose=sumOf(fr,x=>x.close);
  // dues
  
  // leaves
  const lv=db.leaves.filter(l=>leaveDaysIn(l,m)>0);
  const T=monthTotals(m),prevClose=closingGeneral(addM(m,-1)),first=m===s.startMonth;
  const warn=(m<s.startMonth?`<p class="muted"><i>Historical month (before ${mLabel(s.startMonth)}): the opening balance is worked backwards from the verified closing balance of ${dFmt(lastDay(addM(s.startMonth,-1)))}. It is only reliable if every entry from this month onwards has been recorded.</i></p>`:'')+(!s.balanceVerified?`<p class="muted"><i>⚠ The verified opening balance has not been confirmed in Settings – figures are provisional.</i></p>`:'');
  const reconRows=T.has?`<tr><td>Calculated total${T.incSpecial?'':' (general fund only)'}</td><td class="r">${money(T.calc)}</td></tr><tr><td>Actual cash/bank balance – <b>reconciled</b> (entered by user)</td><td class="r">${money(T.actual)}</td></tr><tr class="tot"><td>Difference (actual − calculated)</td><td class="r">${Math.abs(T.diff)<0.005?'0 – matches':money(T.diff)}</td></tr>${db.recon[m]&&db.recon[m].note?`<tr><td colspan="2" class="muted">Note: ${esc(db.recon[m].note)}</td></tr>`:''}`:`<tr><td colspan="2" class="muted">Actual cash/bank balance: not yet entered – the figures above are <b>calculated</b> from recorded entries only.</td></tr>`;
  return `<div class="report">
  ${rptHead('<b>Monthly Accounts Report – '+mLabel(m)+'</b>')}${warn}
  <div class="kpis"><div class="kpi"><span>Opening balance</span><b>${cur(opening)}</b></div><div class="kpi"><span>Total collections</span><b>${cur(totC)}</b></div><div class="kpi"><span>Total expenses</span><b>${cur(totE)}</b></div><div class="kpi"><span>Closing balance</span><b>${cur(closing)}</b></div></div>

  <h4>1. Collections</h4>
  <table><tr><th>Source</th><th class="r">Amount</th></tr>
  <tr><td>Service charge (${svcFlats} of ${s.flats.length} flats paid, ${cur(rateFor(m))} per flat)</td><td class="r">${money(sumOf(svc))}</td></tr>
  ${['extra','garage','bike','other'].map(t=>by(t).length?`<tr><td>${TYPES[t]} (${by(t).length})</td><td class="r">${money(sumOf(by(t)))}</td></tr>`:'').join('')}
  <tr class="tot"><td>Total collections</td><td class="r">${money(totC)}</td></tr></table>

  <h4>2. Expenses</h4>
  ${exp.length?`<table class="small"><tr><th>Date</th><th>Item</th><th class="r">Amount</th></tr>${exp.map(e=>`<tr><td>${dFmt(e.date)}</td><td>${esc(e.category)}${billTag(e)?` <span class="nt">(${esc(billTag(e))})</span>`:''}${e.note?`<span class="nt">${esc(e.note)}</span>`:''}</td><td class="r">${money(e.amount)}</td></tr>`).join('')}<tr class="tot"><td colspan="2">Total expenses (${exp.length})</td><td class="r">${money(totE)}</td></tr></table>`:'<p class="muted">No expenses this month.</p>'}

const FREQ={daily:'Daily',weekly:'Weekly',monthly:'Monthly',quarterly:'Quarterly',yearly:'Yearly',custom:'Custom date'};
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

const addDays=(d,k)=>{const x=new Date(toU(d)+k*864e5);return x.getUTCFullYear()+'-'+pad(x.getUTCMonth()+1)+'-'+pad(x.getUTCDate())};
const hasNum=v=>v!==null&&v!==undefined&&v!==''&&!isNaN(Number(v));

/* ---------- balances ---------- */
function netGen(from,to){let n=0;
  db.collections.forEach(c=>{const k=mOf(c.date);if(k>=from&&k<=to)n+=num(c.amount)});
  db.expenses.forEach(e=>{const k=mOf(e.date);if(k>=from&&k<=to)n-=num(e.amount)});
  return n}
const closingGeneral=m=>openingGeneral(m)+netGen(m,m);
function monthTotals(m){
  const open=openingGeneral(m),exp=sumOf(db.expenses.filter(e=>mOf(e.date)===m)),col=netGen(m,m)+exp;
  const close=open+col-exp,spClose=sumOf(db.funds.filter(f=>mOf(f.date)<=m),f=>fundStat(f,m).bal);
  const rc=db.recon[m]||{},has=hasNum(rc.actual),calc=close;
  return{open,col,exp,close,spClose,has,actual:has?num(rc.actual):null,calc,diff:has?num(rc.actual)-calc:null,incSpecial:rc.incSpecial!==false}}

/* ---------- backup / restore validation ---------- */
function validateBackup(d){
  const e=[];
  if(!d||typeof d!=='object'||Array.isArray(d))return['The file is not a Shantir Neer backup (expected a JSON object).'];
  if(!d.settings||typeof d.settings!=='object')e.push('Missing "settings".');
  if(!Array.isArray(d.collections))e.push('Missing list of collections.');
  if(!Array.isArray(d.expenses))e.push('Missing list of expenses.');
  if((d.v||1)>DBV)e.push('This backup comes from a newer version of the app (v'+d.v+'). Open it in the newer file.');
  [['collections','receipt'],['expenses','expense']].forEach(([k,n])=>{if(Array.isArray(d[k])){let bad=0;d[k].forEach((x,i)=>{if(!x||!/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')||!isFinite(Number(x.amount))){bad++;if(bad<=3)e.push('The '+n+' #'+(i+1)+' has a missing/invalid date or amount.')}});if(bad>3)e.push((bad-3)+' more invalid '+n+'s.')}});
  ['staff','leaves','funds','expected','remLog','imports'].forEach(k=>{if(d[k]!==undefined&&!Array.isArray(d[k]))e.push('"'+k+'" should be a list.')});
  return e}
function doRestore(file){
  const r=new FileReader();
  r.onerror=()=>alert('The file could not be read.');
  r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(x){return alert('Restore cancelled – this is not valid JSON ('+x.message+'). Your current data was not changed.')}
    const err=validateBackup(d);if(err.length)return alert('Restore cancelled – the backup has problems:\n\n• '+err.join('\n• ')+'\n\nYour current data was not changed.');
    const n=d.collections.length+d.expenses.length;
    if(!confirm('This backup has '+d.collections.length+' receipts and '+d.expenses.length+' expenses (saved '+(d.lastBackup?new Date(d.lastBackup).toLocaleDateString():'date unknown')+').\n\nReplace ALL current data with it? A safety copy of the current data is kept in this browser first.'))return;
    try{localStorage.setItem(KEY+'_prerestore',JSON.stringify(db))}catch(x){if(!confirm('A safety copy of the current data could not be stored. Continue anyway?'))return}
    db=migrate(d);save();render();toast('Backup restored ('+n+' entries)')};
  r.readAsText(file)}

/* ---------- checklist ---------- */
function occurrences(m){
  const out=[],last=+lastDay(m).slice(8),mm=+m.slice(5);
  db.expected.filter(x=>x.active&&(x.from||db.settings.startMonth)<=m).forEach(x=>{
    const push=d=>out.push({x,key:x.id+'|'+d,due:d,amount:x.amount}),dd=Math.min(Math.max(+x.dueDay||1,1),last);
    if(x.freq==='monthly')push(m+'-'+pad(dd));
    else if(x.freq==='quarterly'){if(((mm-(+x.dueMonth||1))%3+3)%3===0)push(m+'-'+pad(dd))}
    else if(x.freq==='yearly'){if(mm===(+x.dueMonth||1))push(m+'-'+pad(dd))}
    else if(x.freq==='custom'){if(x.dueDate&&mOf(x.dueDate)===m)push(x.dueDate)}
    else if(x.freq==='weekly'){for(let d=1;d<=last;d++)if(new Date(+m.slice(0,4),mm-1,d).getDay()===(+x.weekday||0))push(m+'-'+pad(d))}
    else if(x.freq==='daily')push(lastDay(m));
  });
  return out.sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0)}
function occByKey(key){const [id,d]=key.split('|'),x=db.expected.find(z=>z.id===id);return x?{x,key,due:d,amount:x.amount}:null}
function chkState(o){
  const c=db.checks[o.key]||{status:'pending'};let st=c.status||'pending',missing=false;
  if(st==='entered'&&!db.expenses.some(e=>e.id===c.expenseId)){st='pending';missing=true}
  const eff=st==='deferred'&&c.deferTo?c.deferTo:o.due,open=st==='pending'||st==='paid'||st==='deferred';
  return{c,st,missing,open,eff,overdue:open&&eff<today()}}
const linkedIds=ex=>new Set(Object.entries(db.checks).filter(([k,c])=>c.status==='entered'&&k!==ex&&c.expenseId).map(([k,c])=>c.expenseId));

/* ---------- reminders ---------- */
function pendingReminders(){
  const R=db.rem,t=today(),now=Date.now(),L=[],tf=R.trackFrom||t,hid=id=>!!((db.snooze[id]&&db.snooze[id]>now)||db.dismissed[id]),cm=thisMonth();
  for(let m=mOf(tf);m<=cm;m=addM(m,1))occurrences(m).forEach(o=>{if(o.due<tf)return;const s=chkState(o);if(s.overdue){const id='chk:'+o.key;L.push({id,kind:'chk',key:o.key,label:o.x.name+(s.st==='paid'?' (paid – entry pending)':s.st==='deferred'?' (deferred)':''),due:s.eff,hidden:hid(id)})}});
  if(R.dailyOn){const n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes());

const IMPF=[['date','Date *'],['amount','Amount (single column)'],['debit','Paid / Debit amount'],['credit','Received / Credit amount'],['dir','Type column (Received / Paid)'],['cat','Category / item / type of receipt'],['from','Flat no. / paid by / paid to'],['note','Note / remarks'],['forMonth','Service charge for month']];
const bnDigits=s=>String(s).replace(/[০-৯]/g,c=>'০১২৩৪৫৬৭৮৯'.indexOf(c));
function parseDate(v){
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+v*864e5);return chkD(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate(),v)}
  const s=bnDigits(String(v??'').trim());if(!s)return{ok:false,err:'is empty – every row needs a date'};
  let m;
  if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))return chkD(+m[1],+m[2],+m[3],s);
  if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))return chkD(+m[3]<100?2000+ +m[3]:+m[3],+m[2],+m[1],s);
  if(m=s.match(/^(\d{1,2})[ -]([A-Za-z]{3,9})[ ,.-]+(\d{4})$/)){const i=MON.findIndex(x=>x.slice(0,3).toLowerCase()===m[2].slice(0,3).toLowerCase());if(i>=0)return chkD(+m[3],i+1,+m[1],s)}
  return{ok:false,err:'“'+s+'” is not a recognised date – use DD/MM/YYYY or YYYY-MM-DD'}}
function chkD(y,m,d,raw){const t=new Date(Date.UTC(y,m-1,d));if(y<2000||y>2100||t.getUTCMonth()!==m-1||t.getUTCDate()!==d)return{ok:false,err:'“'+raw+'” is not a real calendar date (dates are read as DD/MM/YYYY)'};return{ok:true,iso:y+'-'+pad(m)+'-'+pad(d)}}
function parseAmt(v){if(typeof v==='number')return v;let s=bnDigits(String(v??'')).trim();if(!s)return null;let neg=/^\(.*\)$/.test(s)||/^-/.test(s);s=s.replace(/[()৳,\s]|tk\.?|bdt|taka/gi,'').replace(/^-/,'');if(!/^\d*\.?\d+$/.test(s))return NaN;return neg?-Number(s):Number(s)}
function parseDir(v){const s=String(v??'').trim().toLowerCase();if(['received','receive','in','credit','cr','income','collection','r','c'].includes(s))return'c';if(['paid','pay','out','debit','dr','expense','payment','e','p','d'].includes(s))return'e';return null}
const dupKey=(d,t,a,w)=>d+'|'+t+'|'+num(a).toFixed(2)+'|'+String(w||'').trim().toLowerCase();
function parseCSV(txt){
  txt=txt.replace(/^\uFEFF/,'');const first=txt.split(/\r?\n/)[0]||'',sep=[',',';','\t'].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===sep){r.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;r.push(f);f='';rows.push(r);r=[]}
    else f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''))}
function loadXLSX(){return new Promise((ok,no)=>{if(window.XLSX)return ok();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('offline'));document.head.appendChild(s)})}
function guessMap(I){
  const h=(I.hasHeader&&I.rows[0]||[]).map(x=>String(x).toLowerCase()),used=new Set(),M={};
  const rx={date:/date|তারিখ/,debit:/debit|paid|expense|payment|out\b|ব্যয়/,credit:/credit|receiv|income|collection|জমা/,amount:/amount|taka|টাকা|total/,dir:/^(type|direction)|type\b/,cat:/categor|item|head|particular|description|purpose|বিবরণ/,from:/from|flat|name|source|resident|ফ্ল্যাট/,note:/note|remark|detail|memo/,forMonth:/for.?month|service.?month/};
  ['date','debit','credit','forMonth','amount','dir','cat','from','note'].forEach(k=>{const i=h.findIndex((x,j)=>!used.has(j)&&rx[k].test(x));if(i>=0){M[k]=String(i);used.add(i)}else M[k]=''});
  I.map=M}
function impFile(f){
  const I=ui.imp={file:f.name,rows:null,hasHeader:true,map:{},defDir:'e',prev:null,res:null,allowDup:false};

    loadXLSX().then(()=>{r.onload=()=>{try{I.wb=XLSX.read(r.result,{type:'array'});I.sheet=I.wb.SheetNames[0];fin(XLSX.utils.sheet_to_json(I.wb.Sheets[I.sheet],{header:1,raw:true,defval:''}).filter(x=>x.some(v=>String(v).trim()!=='')))}catch(e){alert('Could not read this Excel file: '+e.message+'\nTip: in Excel use File → Save As → CSV and import that.');ui.imp=null;render()}};r.readAsArrayBuffer(f)})

  else{r.onload=()=>fin(parseCSV(String(r.result)));r.readAsText(f)}}
function impPreview(){

    else{const a=parseAmt(g(r,'amount'));
      if(a===null)er.push('Amount is blank');else if(Number.isNaN(a))er.push('Amount “'+g(r,'amount')+'” is not a number – use digits only, e.g. 12500');else if(a<=0)er.push('Amount must be above zero – use the Type column to show money paid');else amt=a;
      if(M.dir!==''&&M.dir!=null){dir=parseDir(g(r,'dir'));if(!dir)er.push('Type “'+g(r,'dir')+'” is not understood – use Received or Paid')}else dir=I.defDir}
    const cat=String(g(r,'cat')).trim(),from=String(g(r,'from')).trim(),note=String(g(r,'note')).trim();
    let rec=null;
    if(!er.length){
      if(dir==='e'){if(!cat)er.push('Category / item is required for expenses');else{if(!cats.has(cat.toLowerCase()))wr.push('new category “'+cat+'”');rec={k:'e',date:dt.iso,category:cat,amount:amt,note:[from,note].filter(Boolean).join(' – '),fundId:''}}}
      else{let type=Object.keys(TYPES).find(k=>k===cat.toLowerCase()||TYPES[k].toLowerCase()===cat.toLowerCase())||(/service/i.test(cat)?'service':null);
        if(!type)type=flats.has(from)?'service':'other';
        if(type==='special')er.push('Special-fund receipts cannot be imported – import as “Other income” or add them in Special Funds');
        else if(type==='service'&&!flats.has(from))er.push('Service charge needs a flat number from Settings → Flats (found “'+from+'”)');
        else{let fm='';if(type==='service'){const p=String(g(r,'forMonth')).trim();fm=/^\d{4}-\d{2}$/.test(p)?p:dt.iso.slice(0,7)}
          rec={k:'c',date:dt.iso,type,from,amount:amt,note,forMonth:fm,fundId:''}}}}
    if(er.length){out.push({n,st:'bad',msg:er,raw:r});return}
    const key=rec.k==='c'?dupKey(rec.date,'c',rec.amount,rec.from||rec.type):dupKey(rec.date,'e',rec.amount,rec.category);
    let st='ok';
    if(ex.has(key)){st='dup';wr.push('looks like '+ex.get(key))}else if(seen.has(key)){st='dup';wr.push('same as row '+seen.get(key)+' in this file')}else seen.set(key,n);

 $('#modal').innerHTML=`<div class="ov"><div class="dlg"><h3>⚠ ${mLabel(m)}: expenses not entered</h3><p class="sub">These common expenses have no entry this month:</p><ul>${ms.map(c=>`<li>${esc(bnCat(c))} <span class="sub">(${esc(c)})</span></li>`).join('')}</ul><div class="btns"><button data-act="closeModal">Continue to report</button><button class="pri" data-act="recur">Add now</button></div></div></div>`}
/* Bengali report */
const BNT={service:'সার্ভিস চার্জ',extra:'অতিরিক্ত আদায়',special:'বিশেষ তহবিল',garage:'গাড়ির গ্যারেজ ভাড়া',bike:'বাইক স্ট্যান্ড ভাড়া',other:'অন্যান্য আয়'};
const BNC={'Water Bill':'পানির বিল','Electric Bill':'বিদ্যুৎ বিল','Moila Bill':'ময়লার বিল','Lift Service Fee':'লিফট সার্ভিস ফি','Internet':'ইন্টারনেট','Security Gas Cylinder':'সিকিউরিটি গ্যাস সিলিন্ডার','Eid Bonus':'ঈদ বোনাস','Eid Bokshish':'ঈদ বখশিশ','Cleaning Materials':'পরিষ্কারের সামগ্রী','Bodli Darowan':'বদলি দারোয়ান'};
const bnCat=c=>BNC[c]||String(c).replace(/^Salary - /,'বেতন - ').replace(/^Advance - /,'অগ্রিম - ');
const bnD=h=>h.replace(/>([^<]+)</g,(x,t)=>'>'+t.replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d])+'<');
const bnM=m=>{const [y,k]=m.split('-').map(Number);return new Date(y,k-1,1).toLocaleString('bn-BD',{month:'long',year:'numeric'})};
function reportHTML(m){const s=db.settings,y=m.slice(0,4),srt=(a,b)=>a.date<b.date?-1:1;
 const fname=id=>(db.funds.find(f=>f.id===id)||{}).name||'';
 const col=db.collections.filter(c=>mOf(c.date)===m&&!c.fundId).sort(srt),spCol=db.collections.filter(c=>mOf(c.date)===m&&c.fundId);
 const exp=db.expenses.filter(e=>mOf(e.date)===m).sort(srt); /* special fund spending is an ordinary expense */
 const op=openingGeneral(m),tc=sumOf(col)+sumOf(spCol),te=sumOf(exp),cl=op+tc-te,svc=col.filter(c=>c.type==='service');
 const spBy={};spCol.forEach(c=>(spBy[c.fundId]=spBy[c.fundId]||[]).push(c));
 /* pending special fund dues, up to the end of this month */
 const pf=db.funds.filter(f=>mOf(f.date)<=m).map(f=>{const cs=db.collections.filter(c=>c.fundId===f.id&&mOf(c.date)<=m),per=num(f.perFlat),target=num(f.target),raised=sumOf(cs);
  const dues=per>0?s.flats.map(x=>({id:x.id,d:Math.max(0,per-sumOf(cs.filter(c=>c.from===x.id)))})).filter(x=>x.d>0):[];
  return{f,per,target,raised,dues,pend:per>0?sumOf(dues,x=>x.d):Math.max(0,target-raised)}}).filter(x=>x.pend>0);
 const adv=db.staff.map(x=>({n:x.name,o:advOut(x.id)})).filter(x=>x.o>0);
 const lv=db.staff.filter(x=>x.active&&x.role==='Guard').map(x=>({n:x.name,a:num(x.allowance),u:sumOf(db.leaves.filter(l=>l.staffId===x.id&&okL(l)&&l.type!=='Unpaid'),l=>leaveDaysYear(l,y))}));
 let n=0;const H=t=>`<h4>${++n}. ${t}</h4>`;
 return bnD(`<div class="report">${rptHead('<b>মাসিক হিসাব প্রতিবেদন – '+bnM(m)+'</b>')}${s.balanceVerified?'':'<p class="muted"><i>⚠ প্রারম্ভিক জের যাচাই করা হয়নি – হিসাব সাময়িক।</i></p>'}
 <div class="kpis"><div class="kpi"><span>প্রারম্ভিক জের</span><b>${cur(op)}</b></div><div class="kpi"><span>মোট আয়</span><b>${cur(tc)}</b></div><div class="kpi"><span>মোট ব্যয়</span><b>${cur(te)}</b></div><div class="kpi"><span>সমাপনী জের</span><b>${cur(cl)}</b></div></div>
 ${H('আয়')}<table><tr><th>খাত</th><th class="r">টাকা</th></tr><tr><td>সার্ভিস চার্জ (${new Set(svc.map(c=>c.from)).size}/${s.flats.length} ফ্ল্যাট, প্রতি ফ্ল্যাট ${cur(rateFor(m))})</td><td class="r">${money(sumOf(svc))}</td></tr>${['extra','garage','bike','other'].map(t=>{const a=col.filter(c=>c.type===t);return a.length?`<tr><td>${BNT[t]} (${a.length})</td><td class="r">${money(sumOf(a))}</td></tr>`:''}).join('')}${Object.entries(spBy).map(([id,a])=>`<tr><td>বিশেষ তহবিল – ${esc(fname(id))} (${a.length})</td><td class="r">${money(sumOf(a))}</td></tr>`).join('')}<tr class="tot"><td>মোট আয়</td><td class="r">${money(tc)}</td></tr></table>
 ${H('ব্যয়')}${exp.length?`<table class="small"><tr><th>বিবরণ</th><th class="r">টাকা</th></tr>${exp.map(e=>`<tr><td>${esc(bnCat(e.category))}${isBill(e.category)&&e.billMonth?` <span class="nt">(${esc(bnM(e.billMonth))})</span>`:''}${e.fundId?` <span class="tag a">বিশেষ তহবিল: ${esc(fname(e.fundId))}</span>`:''}${e.note?`<span class="nt">${esc(e.note)}</span>`:''}</td><td class="r">${money(e.amount)}</td></tr>`).join('')}<tr class="tot"><td>মোট ব্যয় (${exp.length})</td><td class="r">${money(te)}</td></tr></table>`:'<p class="muted">এই মাসে কোনো ব্যয় নেই।</p>'}
 ${pf.length?`${H('বকেয়া বিশেষ তহবিল')}${pf.map(x=>x.per>0?`<p style="margin:8px 0 3px"><b>${esc(x.f.name)}</b> <span class="muted">(প্রতি ফ্ল্যাট ${cur(x.per)})</span></p><table class="small"><tr><th>ফ্ল্যাট</th><th class="r">বকেয়া</th></tr>${x.dues.map(d=>`<tr><td>${esc(d.id)}</td><td class="r neg">${money(d.d)}</td></tr>`).join('')}<tr class="tot"><td>মোট বকেয়া (${x.dues.length} ফ্ল্যাট)</td><td class="r">${money(x.pend)}</td></tr></table>`:`<p style="margin:8px 0 3px"><b>${esc(x.f.name)}</b> <span class="muted">(লক্ষ্যমাত্রা ${cur(x.target)}, আদায় ${cur(x.raised)})</span> – বকেয়া <b class="neg">${cur(x.pend)}</b></p>`).join('')}`:''}
 ${adv.length?`${H('অগ্রিম বেতন (বকেয়া)')}<table class="small">${adv.map(x=>`<tr><td>${esc(x.n)}</td><td class="r">${money(x.o)}</td></tr>`).join('')}</table>`:''}
 ${H('ছুটির ব্যালান্স – '+y)}<table class="small"><tr><th>নাম</th><th class="r">বরাদ্দ</th><th class="r">ব্যবহৃত</th><th class="r">অবশিষ্ট</th></tr>${lv.map(x=>`<tr><td>${esc(x.n)}</td><td class="r">${x.a}</td><td class="r">${x.u}</td><td class="r">${x.a-x.u}</td></tr>`).join('')}</table><p class="muted" style="font-size:11px">প্রতি বছর ডিসেম্বরে ছুটির ব্যালান্স শূন্য হয়; জানুয়ারিতে নতুন ছুটি বরাদ্দ করা হয়।</p>
 <p class="gen">প্রস্তুতের তারিখ: ${dFmt(today())}</p></div>`)}
render();
</script>
</body>
</html>
